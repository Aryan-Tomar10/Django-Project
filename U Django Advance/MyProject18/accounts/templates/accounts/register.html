{% extends "accounts/base.html" %}

{% block content%}
<h2>Register</h2>
<form method="post">
    {% csrf_token %}
    {{form.as_p}}
    {% comment %} <p>Username : <input type="text" name = 'Username'></p>
    <p>Password : <input type="text" name = 'Password'></p> {% endcomment %}
    <button type="submit">Register</button>
</form>
{% endblock %}
