{% extends "blog/base.html" %}
{% block content%}
<h2>{{post.title}}</h2>
<h2>{{post.content}}</h2>
<a href="{% url "Post_list" %}" class = 'btn btn-secondary'>Back to all Post</a>

<a href="{% url "Post_delete" post.pk%}" class = 'btn btn-secondary'>Delete Post</a>
{% endblock %}
