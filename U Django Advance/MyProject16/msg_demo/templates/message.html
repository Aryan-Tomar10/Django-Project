<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}This is to show message details{% endblock %}</title>
    <style>
        .debug {color : grey;}
        .info {color : blue;}
        .success {color : green;}
        .warning {color : orange;}
        .error {color : red;}
        ul {list-style-type: none; padding: 0;}
        li {margin : 5px 0;}
    </style>
</head>
<body>
    <h1>All Message Data</h1>
    {% if messages %}
    <ul>
        {% for message in messages %}
        <li class = {{message.tags}}>
            {{message}}
        </li>
        {% endfor %}
    </ul>
    {% else %}
    <p>No Message available</p>
    {% endif %}
</body>
</html>
