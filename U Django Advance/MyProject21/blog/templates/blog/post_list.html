<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search using Q Object, Filter querysets dynamically</title>
</head>
<body>
    <h1>Search and filter Example</h1>
    <form method="get" class = 'search-form'>
        <input type="text" name = 'q' placeholder = 'Search...' value = "{{query}}">
        <select name="catagory">
            <option value="">All Catagory</option>
            <option value="Tech" {% if catagory == 'Tech' %}Selected{% endif %}>Tech</option>
            <option value="News" {% if catagory == 'News' %}Selected{% endif %}>News</option>
            <option value="Tutorial" {% if catagory == 'Tutorial' %}Selected{% endif %}>Tutorial</option>
        </select>
        <button type="submit">Search</button>
    </form>
    <ul>
        {% for post in posts %}
            <li>
                <h2>{{post.title}}</h2>
                <p>{{post.content}}</p>
                <p><strong> Catagory :</strong>{{post.catagory}}</p>
            </li>
        {% empty %}
        <li>No posts found.</li>
        {% endfor %}
    </ul>
</body>
</html>
