<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User File based cache</title>
</head>
<body>
    <h1>User Data (File-Based Cache Demo)</h1>
    <table border = '1' cellpadding = '10'>
        <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Subscribers</th>
        </tr>
        {% for user in users %}
        <tr>
            <td>{{user.name}}</td>
            <td>{{user.email}}</td>
            <td>{{user.sub}}</td>
        </tr>        
        {% endfor %}
    </table>
</body>
</html>
